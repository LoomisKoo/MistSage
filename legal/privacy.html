<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代价账本 · 隐私政策</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; line-height: 1.6; color: #141C2E; }
    h1 { font-size: 1.4rem; }
    p, li { color: #404D61; }
  </style>
</head>
<body>
  <h1>隐私政策</h1>
  <p>更新日期：2026-10-13</p>
  <p>代价账本（以下简称「本应用」）重视你的隐私。本政策说明我们如何处理信息。</p>
  <h2>1. 我们收集什么</h2>
  <ul>
    <li>你主动填写的决策、审核、资产与昵称等，默认仅保存在本机。</li>
    <li>若你选择上传头像，图片仅保存在本机沙盒。</li>
  </ul>
  <h2>2. 我们如何使用</h2>
  <p>仅用于向你展示账本与统计，不出售个人数据。</p>
  <h2>3. 第三方</h2>
  <p>当前版本不默认向第三方上传上述内容。后续若接入社交审核或云同步，将另行告知并征得同意。</p>
  <h2>4. 联系我们</h2>
  <p>如有疑问，请通过 App Store 页预留邮箱联系开发者。</p>
</body>
</html>
