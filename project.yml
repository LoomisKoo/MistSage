name: MistSage
options:
  developmentLanguage: zh-Hans
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
  bundleIdPrefix: com.tincom
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.0"
  ENABLE_USER_SCRIPT_SANDBOXING: YES
  DEAD_CODE_STRIPPING: YES
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  MistSage:
    type: application
    platform: iOS
    sources:
      - MistSage
    entitlements:
      path: MistSage/MistSage.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tincom.mistsage
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.tincom.mistsage
      PRODUCT_NAME: MistSage
      INFOPLIST_KEY_CFBundleDisplayName: MistSage
      INFOPLIST_KEY_LSHasLocalizedDisplayName: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      TARGETED_DEVICE_FAMILY: "1,2"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1.0"
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_EMIT_LOC_STRINGS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于设置头像和资产照片，图片会同步到你的账号。
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于设置头像和资产照片，图片会同步到你的账号。
