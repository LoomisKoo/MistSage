name: CostLedger
options:
  bundleIdPrefix: com.loomis
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  BASE_SDK: iphoneos
  SWIFT_VERSION: "5.0"
targets:
  CostLedger:
    type: application
    platform: iOS
    sources:
      - CostLedger
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.loomis.CostLedger
      PRODUCT_NAME: 代价账本
      INFOPLIST_KEY_CFBundleDisplayName: 代价账本
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      TARGETED_DEVICE_FAMILY: "1,2"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "0.1.0"
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_EMIT_LOC_STRINGS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于设置头像，图片仅保存在本机。
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用于设置头像，图片仅保存在本机。
